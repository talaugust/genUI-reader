<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Reader</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="{{ url_for('static', filename='components.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='components.css') }}">

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f4f4f9;
            color: #333;
            margin: 0;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 20px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        header h1 { font-size: 1.2em; margin: 0; }
        header p  { margin: 0; color: #666; font-size: 0.9em; }

        #modes label { margin-left: 12px; cursor: pointer; }

        main {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 60px);
        }

        #pdf-container { overflow-y: auto; }

        /* Each rendered PDF page: canvas + text layer stacked */
        .pdf-page {
            position: relative;
            margin: 0 auto 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background: white;
        }

        .pdf-page canvas { display: block; }

        /* PDF.js text layer: invisible text over the canvas, so you can select it */
        .textLayer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            line-height: 1;
            -webkit-text-size-adjust: none;
        }

        .textLayer span,
        .textLayer br {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
        }

        .textLayer ::selection { background: rgba(0, 90, 255, 0.3); }

        /* Floating button that appears when you select text */
        #generate-btn {
            position: absolute;
            z-index: 10;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            background: #3b5bdb;
            color: white;
            font-size: 0.9em;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Side panel of generated widgets, newest first */
        #panel { overflow-y: auto; }

        #empty {
            color: #888;
            text-align: center;
            margin-top: 40px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card-meta {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #3b5bdb;
            margin-bottom: 8px;
        }

        .card blockquote {
            margin: 0 0 12px;
            padding-left: 10px;
            border-left: 3px solid #ddd;
            color: #777;
            font-size: 0.85em;
            max-height: 4.5em;
            overflow: hidden;
        }

        .card iframe {
            width: 100%;
            height: 300px;
            border: 1px solid #eee;
            border-radius: 4px;
        }

        .card details { margin-top: 10px; font-size: 0.8em; color: #777; }
        .card pre {
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
            background: #f7f7f7;
            padding: 8px;
        }

        .error { color: #c92a2a; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Generative Reader</h1>
            <p>Select a passage, then click Generate.</p>
        </div>
        <div id="modes">
            Mode:
            <label><input type="radio" name="mode" value="catalog" checked> Catalog</label>
            <label><input type="radio" name="mode" value="freeform"> Freeform</label>
            <label><input type="radio" name="mode" value="both"> Both</label>
        </div>
    </header>

    <main>
        <div id="pdf-container"></div>
        <div id="panel">
            <p id="empty">Generated widgets will appear here.</p>
        </div>
    </main>

    <button id="generate-btn" hidden>Generate</button>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const container = document.getElementById('pdf-container');
        const panel = document.getElementById('panel');
        const button = document.getElementById('generate-btn');

        // ---------------------------------------------------------
        // 1. Render the PDF (canvas for the picture, text layer for selecting)
        // ---------------------------------------------------------
        async function renderPDF() {
            const pdf = await pdfjsLib.getDocument('/pdf').promise;
            const dpr = window.devicePixelRatio || 1;

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                const fitScale = (container.clientWidth - 20) / page.getViewport({ scale: 1 }).width;
                const viewport = page.getViewport({ scale: Math.min(fitScale, 1.5) });

                const pageWrapper = document.createElement('div');
                pageWrapper.className = 'pdf-page';
                pageWrapper.style.width  = `${viewport.width}px`;
                pageWrapper.style.height = `${viewport.height}px`;

                const canvas = document.createElement('canvas');
                canvas.width  = viewport.width * dpr;
                canvas.height = viewport.height * dpr;
                canvas.style.width  = `${viewport.width}px`;
                canvas.style.height = `${viewport.height}px`;
                await page.render({
                    canvasContext: canvas.getContext('2d'),
                    viewport,
                    transform: [dpr, 0, 0, dpr, 0, 0],
                }).promise;

                const textLayerDiv = document.createElement('div');
                textLayerDiv.className = 'textLayer';
                textLayerDiv.style.setProperty('--scale-factor', viewport.scale);
                await pdfjsLib.renderTextLayer({
                    textContentSource: await page.getTextContent(),
                    container: textLayerDiv,
                    viewport,
                    textDivs: [],
                }).promise;

                pageWrapper.appendChild(canvas);
                pageWrapper.appendChild(textLayerDiv);
                container.appendChild(pageWrapper);
            }
        }

        // ---------------------------------------------------------
        // 2. Show the Generate button next to selected text
        // ---------------------------------------------------------
        let selectedText = '';

        container.addEventListener('mouseup', (event) => {
            selectedText = window.getSelection().toString().replace(/\s+/g, ' ').trim();
            if (selectedText.length < 3) {
                button.hidden = true;
                return;
            }
            button.style.left = `${event.pageX + 8}px`;
            button.style.top  = `${event.pageY + 8}px`;
            button.hidden = false;
        });

        // Hide the button when clicking anywhere else
        document.addEventListener('mousedown', (event) => {
            if (event.target !== button) button.hidden = true;
        });

        // Keep the selection when the button is pressed
        button.addEventListener('mousedown', (event) => event.preventDefault());

        button.addEventListener('click', () => {
            button.hidden = true;
            const mode = document.querySelector('input[name="mode"]:checked').value;
            // "Both" adds the freeform card first so the catalog card ends up on top
            if (mode === 'freeform' || mode === 'both') generate('freeform', selectedText);
            if (mode === 'catalog'  || mode === 'both') generate('catalog', selectedText);
        });

        // ---------------------------------------------------------
        // 3. Ask the backend for a widget and show it in a new card
        // ---------------------------------------------------------
        async function generate(mode, passage) {
            document.getElementById('empty')?.remove();

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-meta">${mode}</div>
                <blockquote>${esc(passage)}</blockquote>
                <div class="widget">Generating...</div>
                <details><summary>Raw model output</summary><pre></pre></details>`;
            panel.prepend(card);

            const meta = card.querySelector('.card-meta');
            const widget = card.querySelector('.widget');
            const raw = card.querySelector('pre');

            try {
                const route = mode === 'catalog' ? '/generate' : '/generate_html';
                const response = await fetch(route, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passage }),
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                raw.textContent = data.raw;

                if (mode === 'catalog') {
                    const spec = data.spec || { component: 'text_card', props: { text: data.raw } };
                    meta.textContent = `catalog · ${spec.component}`;
                    widget.innerHTML = renderComponent(spec);
                } else {
                    showInSandbox(widget, data.html);
                }
            } catch (err) {
                widget.innerHTML = `<p class="error">Error: ${esc(err.message)}</p>`;
            }
        }

        // ---------------------------------------------------------
        // 4. Freeform HTML runs in a sandboxed iframe: its scripts can run,
        //    but it can't read this page, your cookies, or call your backend.
        // ---------------------------------------------------------
        function showInSandbox(widget, html) {
            // Small script added to the widget so it can tell us its height
            const sizer = `<script>
                setInterval(() => {
                    let bottom = 0;
                    for (const el of document.body.children) {
                        bottom = Math.max(bottom, el.getBoundingClientRect().bottom + scrollY);
                    }
                    parent.postMessage({ height: Math.ceil(bottom) + 16 }, '*');
                }, 500);
            <\/script>`;

            const frame = document.createElement('iframe');
            frame.setAttribute('sandbox', 'allow-scripts');
            frame.srcdoc = html + sizer;
            widget.innerHTML = '';
            widget.appendChild(frame);
        }

        window.addEventListener('message', (event) => {
            for (const frame of document.querySelectorAll('.card iframe')) {
                if (frame.contentWindow === event.source && event.data.height) {
                    frame.style.height = `${Math.min(Math.max(event.data.height, 80), 800)}px`;
                }
            }
        });

        renderPDF();
    </script>
</body>
</html>
